<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Lowpoly Workshop: reference to editable game asset</title>
<desc id="desc">Set the reference and scale, author an editable generator, build GLB and Blender files, inspect and repair, then hand over a viewer and source bundle. Repairs loop back to the source.</desc>
